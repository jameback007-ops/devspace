[Service]
Environment=DEVSPACE_CONVERSATION_TRANSPORT=1
Environment=DEVSPACE_CONVERSATION_TRANSPORT_EFFECTS=0
Environment=DEVSPACE_CONVERSATION_TRANSPORT_BRIDGE_SOCKET=/run/zes-conversation-transport-bridge/bridge.sock
Environment=DEVSPACE_CONVERSATION_TRANSPORT_TIMEOUT_SECONDS=20
Environment=DEVSPACE_CODEX_INTEGRATION=1
Environment=DEVSPACE_CODEX_INTEGRATION_BRIDGE_SOCKET=/run/zes-conversation-transport-bridge/bridge.sock
Environment=DEVSPACE_CODEX_INTEGRATION_TIMEOUT_SECONDS=30
