[project]
name = "chatgpt-langchain-capability-bridge"
version = "0.2.0"
description = "Stable MCP capability plane that lets ChatGPT own coding while reusing Deep Agents, LangGraph, Agent Server, and native sandbox providers."
requires-python = ">=3.11,<3.14"
dependencies = [
  "deepagents==0.7.8",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-sdk==0.4.3",
  "langsmith==0.11.1",
  "mcp[cli]==2.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]
agent-server = [
  "langgraph-cli[inmem]==0.4.31",
]

[project.scripts]
chatgpt-langchain-bridge = "chatgpt_langchain_bridge.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_langchain_bridge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
