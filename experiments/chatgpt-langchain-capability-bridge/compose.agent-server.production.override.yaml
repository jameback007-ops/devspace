# Thin deployment binding over the Compose topology generated by native
# LangGraph CLI. This file must not contain runtime credentials or replace
# native Postgres, Redis, queue, health, migration, or API behavior.

services:
  langgraph-api:
    # The write-capable Agent Server and MCP route stay private to the VPS.
    ports: !override
      - "127.0.0.1:${LANGGRAPH_HOST_PORT:-2027}:8000"

    # Both paths are supplied explicitly by the root-owned activation unit.
    # The first file is the tracked, non-secret bridge configuration; the
    # second is the external 0600 production credential/data-plane binding.
    env_file: !override
      - path: "${LANGGRAPH_BRIDGE_ENV_FILE:?Set LANGGRAPH_BRIDGE_ENV_FILE}"
        required: true
      - path: "${LANGGRAPH_PRODUCTION_ENV_FILE:?Set LANGGRAPH_PRODUCTION_ENV_FILE}"
        required: true

  langgraph-postgres:
    # Agent Server reaches Postgres on the private Compose network. Operator
    # diagnostics use docker exec; the database is not published on the host.
    ports: !override []
