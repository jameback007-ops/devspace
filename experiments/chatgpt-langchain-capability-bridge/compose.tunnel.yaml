services:
  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.12
    profiles:
      - tunnel
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?Create a tunnel in OpenAI Platform tunnel settings}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:?Create a runtime API key with Tunnels Read + Use}
      MCP_SERVER_URL: url=http://bridge:8765/mcp,channel=main
      MCP_STARTUP_WAIT_TIMEOUT: 30s
      HEALTH_LISTEN_ADDR: 0.0.0.0:8080
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "127.0.0.1:${TUNNEL_HEALTH_PORT:-18080}:8080"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
